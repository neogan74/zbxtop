[package]
name = "ztop"
version = "0.1.0"
edition = "2021"
description = "TUI monitor for zabbix_server internals over SSH"
license = "MIT"

[dependencies]
ratatui = "0.28"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "io-util", "sync", "net"] }
futures = "0.3"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-postgres = "0.7"
# Using native-tls (via openssl on Linux/macOS, schannel on Windows).
# mysql_async already pulls in native-tls in its defaults — shared dependency, no duplication.
postgres-native-tls = "0.5"
native-tls = "0.2"
# If you want pure-Rust TLS without openssl, switch to:
#   mysql_async = { version = "0.34", default-features = false, features = ["minimal", "rustls-tls"] }
mysql_async = "0.34"
toml = "0.8"
dirs = "5"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
