[package]
name = "ztop"
version = "0.1.0"
edition = "2021"
description = "TUI monitor for zabbix_server internals over SSH"
license = "MIT"

[dependencies]
ratatui = "0.28"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time", "io-util", "sync", "signal"] }
futures = "0.3"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
regex = "1"
once_cell = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
