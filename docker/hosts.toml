# ztop config for the local docker-compose testbed.
#
# Use as:  ztop --config docker/hosts.toml
# Or copy to  ~/.config/ztop/hosts.toml  and just run `ztop`.

[[host]]
name = "testbed"
ssh = "ztop-testbed"                          # alias from ~/.ssh/config (see setup.sh)
log = "/var/log/zabbix/zabbix_server.log"
sudo = true                                   # zabbix_server -R via sudo (sudoers in Dockerfile)

# zabbix.stats доступен на trapper-порту 10051 (проброшен из контейнера).
stats_host = "127.0.0.1"
stats_port = 10051

# DB-источник — PG в соседнем контейнере, проброшен на 55432.
db_url = "postgres://zabbix:zabbix@127.0.0.1:55432/zabbix?sslmode=disable"

# ---- Probes ----
# Check the network from the ztop machine. All three should be OK on a healthy testbed.

[[probe]]
name = "Trapper TCP"
kind = "tcp"
target = "127.0.0.1:10051"
interval = 3

[[probe]]
name = "PG latency"
kind = "pg"
url = "postgres://zabbix:zabbix@127.0.0.1:55432/zabbix"
interval = 5

[[probe]]
name = "DNS localhost"
kind = "dns"
target = "localhost"
interval = 10

# Web UI probe (port 8088 — zabbix-web container). Not critical, but visible
# if PHP/nginx in zabbix-web goes down — this is 4th-layer diagnostics.
[[probe]]
name = "Web frontend"
kind = "tcp"
target = "127.0.0.1:8088"
interval = 10
