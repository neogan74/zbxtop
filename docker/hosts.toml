# ztop config для локального docker-compose testbed.
#
# Используй как:  ztop --config docker/hosts.toml
# Или скопируй в  ~/.config/ztop/hosts.toml  и запускай просто `ztop`.

[[host]]
name = "testbed"
ssh = "ztop-testbed"                          # alias из ~/.ssh/config (см. setup.sh)
log = "/var/log/zabbix/zabbix_server.log"
sudo = true                                   # zabbix_server -R через sudo (sudoers в Dockerfile)

# zabbix.stats доступен на trapper-порту 10051 (проброшен из контейнера).
stats_host = "127.0.0.1"
stats_port = 10051

# DB-источник — PG в соседнем контейнере, проброшен на 55432.
db_url = "postgres://zabbix:zabbix@127.0.0.1:55432/zabbix?sslmode=disable"

# ---- Probes ----
# Проверяют сеть из машины ztop. Все три должны быть OK на здоровом testbed.

[[probe]]
name = "Trapper TCP"
kind = "tcp"
target = "127.0.0.1:10051"
interval = 3

[[probe]]
name = "PG latency"
kind = "pg"
url = "postgres://zabbix:zabbix@127.0.0.1:55432/zabbix"
interval = 5

[[probe]]
name = "DNS localhost"
kind = "dns"
target = "localhost"
interval = 10

# Web UI probe (port 8088 — zabbix-web container). Не критично, но видно
# если PHP/Apache в zabbix-web лёг — это диагностика 4-го слоя.
[[probe]]
name = "Web frontend"
kind = "tcp"
target = "127.0.0.1:8088"
interval = 10
